# Defaults suit a MySQL on localhost. Docker Compose overrides DB_URL.
# useAffectedRows=true: a repeated event reports 0 rows changed, so we can count duplicates.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boxscore?useAffectedRows=true}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Lets POST /games/{id}/events take one event or an array of them.
spring.jackson.deserialization.accept-single-value-as-array=true
# Leaves null fields out of responses, such as the name of a team total.
spring.jackson.default-property-inclusion=non_null
